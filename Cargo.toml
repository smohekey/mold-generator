[workspace]
resolver = "2"
members = [
    "crates/mold-geometry",
    "crates/mold-core",
    "crates/mold-cli",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
rust-version = "1.85"

[workspace.dependencies]
mold-geometry = { path = "crates/mold-geometry" }
mold-core = { path = "crates/mold-core" }
