name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  visual-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate gull wing and shell mold
        run: cargo run -p mold-shell --example gull_sample --release
      - name: Upload visual sample
        uses: actions/upload-artifact@v4
        with:
          name: gull-wing-mold-sample
          path: |
            target/sample-mold/*.stl
            target/sample-mold/*.3mf
          if-no-files-found: error
