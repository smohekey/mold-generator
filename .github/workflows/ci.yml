name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  visual-sample:
    name: Visual sample (${{ matrix.sample }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sample: gull
            example: gull_sample
            artifact: gull-wing-mold-sample
            output: target/sample-mold
          - sample: straight
            example: straight_sample
            artifact: straight-wing-mold-sample
            output: target/sample-mold/straight
          - sample: spitfire
            example: spitfire_sample
            artifact: spitfire-wing-mold-sample
            output: target/sample-mold/spitfire
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Diagnose registration intersections
        if: matrix.sample == 'gull'
        run: cargo run -p mold-shell --example socket_debug --release
      - name: Generate wing and shell mold
        run: cargo run -p mold-samples --example ${{ matrix.example }} --release
      - name: Upload visual sample artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.output }}/*.stl
            ${{ matrix.output }}/*.3mf
          if-no-files-found: error
